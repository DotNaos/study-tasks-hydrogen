[project]
name = "study-tasks-api"
version = "0.1.0"
description = "FastAPI backend for study-tasks-hydrogen"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.11.0",
  "pyjwt[crypto]==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
